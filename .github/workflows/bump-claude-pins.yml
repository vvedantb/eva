# Keeps the Claude Agent SDK / Claude Code CLI pins on the latest published
# pair. New Claude models are gated on the CLI binary's own version, so until
# the pin moves every sandbox keeps serving the previous model — Fable 5.1 was
# unusable on CLI 2.1.246 (changelog, 2026-09-02) and Opus 5.5 on 2.1.258.
#
# The pins cannot simply be `@latest`: the snapshot seed resolves `@latest` once
# when the image is baked and then freezes it, which is how those snapshots went
# stale in the first place. So this opens a PR instead — exact pins, reviewed,
# and the CI gate still runs before it merges.

name: Bump Claude pins

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: every scheduled workflow on
    # GitHub piles onto :00, which is when runner queues are slowest.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: bump-claude-pins
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      # Skip the husky `prepare` hook during install.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No-ops and exits 0 when the pins are already current, so the steps below
      # find an empty diff and the job ends without opening anything.
      - name: Bump pins
        run: node scripts/bump-claude-pins.mjs

      - name: Open a PR when something moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Pins already current; nothing to open."
            exit 0
          fi

          CLI=$(grep -oP 'CLAUDE_CODE_VERSION = "\K[^"]+' \
            packages/backend/convex/_sandbox_runtime/claudeCliVersion.ts)
          SDK=$(grep -oP 'const SDK_VERSION = "\K[^"]+' \
            packages/backend/callback-src/providers/claudeSdk.ts)
          BRANCH="chore/claude-pins-${CLI}"

          # Someone may have merged this exact bump already, or a previous run
          # may have left the branch behind.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; leaving it alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: bump Claude CLI to ${CLI}, agent SDK to ${SDK}"
          git push -u origin "refs/heads/${BRANCH}:refs/heads/${BRANCH}"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump Claude CLI to ${CLI}, agent SDK to ${SDK}" \
            --body "$(cat <<EOF
          Automated by \`.github/workflows/bump-claude-pins.yml\`.

          - Claude Code CLI → \`${CLI}\`
          - Claude Agent SDK → \`${SDK}\`

          The CLI version is read from the SDK's own \`claudeCodeVersion\` manifest
          field, so the pair is the publisher's, not an inference from the patch
          components. All five pin sites moved, the callback bundle was
          regenerated, and \`providerSdkDependenciesContract\` passed.

          **Why this matters:** new models are gated on the CLI binary's version.
          Until this merges and deploys, sandboxes keep serving the previous
          model even on old sessions.

          **Worth a skim before merging:** a callback turn that streams no
          activity at all is the failure mode of an SDK message-shape change —
          the last bump (0.3.201 → 0.3.258) surfaced three real defects that way.
          EOF
          )"
