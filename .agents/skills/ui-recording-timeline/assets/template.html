<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint timeline</title>
<style>
  :root { --fg:#ededed; --muted:#7a7a7a; --line:#222 }
  * { box-sizing:border-box }
  html,body { height:100%; margin:0; background:#000; color:var(--fg); overflow:hidden;
    font:12px/1.4 ui-sans-serif,-apple-system,"Geist",system-ui,sans-serif }
  .mono { font-family:ui-monospace,"Geist Mono",Menlo,monospace; font-variant-numeric:tabular-nums }
  body { display:grid; grid-template-rows:1fr auto; height:100vh }

  /* stage: the video takes everything */
  .vwrap { position:relative; min-height:0 }
  .vwrap video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block }
  #fx { position:absolute; pointer-events:none; overflow:hidden }
  .flash { position:absolute; border:2px solid #ff2d75; background:rgba(255,45,117,.22); border-radius:3px;
    box-shadow:0 0 0 1px rgba(255,255,255,.6), 0 0 16px rgba(255,45,117,.6); animation:flash 1.1s ease-out forwards }
  .flash.full { border-width:4px; background:rgba(255,45,117,.12) }
  .move { position:absolute; border:2px solid #38bdf8; background:rgba(56,189,248,.12); border-radius:3px; animation:move 1.1s ease-in-out forwards }
  @keyframes flash { 0%{opacity:0} 8%{opacity:1} 22%{opacity:.35} 36%{opacity:1} 100%{opacity:0} }
  @keyframes move { 0%{opacity:1; transform:translate(var(--dx),var(--dy))} 45%{opacity:1; transform:none} 100%{opacity:0; transform:none} }

  /* bottom bar: one caption line + a thin timeline */
  .bar { padding:6px 14px 8px; background:#0a0a0a; border-top:1px solid var(--line) }
  .cap { display:flex; align-items:baseline; gap:12px; white-space:nowrap; min-width:0 }
  .cap .t { font-size:13px; color:#fff } .cap .n { color:var(--muted) }
  .cap .l { font-size:13px; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0 }
  .cap .d { color:var(--muted) }
  .dot { display:inline-block; width:7px; height:7px; border-radius:99px; background:var(--c); margin-right:6px; vertical-align:1px }
  .ph { color:var(--muted) }
  .right { display:flex; gap:14px; color:var(--muted); align-items:baseline }
  .right b { color:var(--fg); font-weight:500 }
  .k { cursor:pointer; user-select:none } .k:hover { color:var(--fg) } .k.off { text-decoration:line-through }
  .sw { display:inline-block; width:8px; height:8px; border-radius:2px; margin:0 4px 0 8px; vertical-align:0 }

  .track { position:relative; height:22px; margin-top:6px; cursor:pointer; user-select:none }
  .phases { position:absolute; left:0; right:0; bottom:4px; height:4px; border-radius:2px; overflow:hidden }
  .phase { position:absolute; top:0; bottom:0 }
  /* idle = nothing on screen changing: hatched mid-grey, still clearly part of the bar */
  .idle { background:repeating-linear-gradient(135deg, #8a8a8a 0 2px, #3a3a3a 2px 5px) !important }
  .tick { position:absolute; bottom:10px; width:1px; height:9px; background:#9a9a9a; transform:translateX(-.5px) }
  .tick.minor { height:5px; background:#555 } .tick.on { background:#fff; width:2px; height:11px }
  .playhead { position:absolute; top:0; bottom:0; width:2px; background:#fff; pointer-events:none; border-radius:1px }
  .hoverline { position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.3); pointer-events:none; display:none }
  .peek { position:absolute; bottom:28px; width:240px; transform:translateX(-50%); background:#111; border:1px solid #333;
    border-radius:6px; overflow:hidden; pointer-events:none; display:none; z-index:10 }
  .peek img { width:100%; display:block } .peek div { padding:4px 7px; font-size:11px }

  /* paint list drawer (l) */
  .drawer { position:fixed; top:0; right:0; bottom:0; width:380px; background:rgba(10,10,10,.94); backdrop-filter:blur(8px);
    border-left:1px solid var(--line); overflow:auto; transform:translateX(100%); transition:transform .18s; z-index:20 }
  .drawer.open { transform:none }
  .row { display:grid; grid-template-columns:48px 56px 1fr; gap:8px; padding:6px 12px; border-bottom:1px solid #1a1a1a; cursor:pointer; border-left:2px solid var(--c) }
  .row:hover { background:#161616 } .row.active { background:#26121a } .row.minor .lbl { color:var(--muted) }
  .row .d { color:var(--muted) }
  .info { padding:12px; color:var(--muted); line-height:1.55 } .info b { color:var(--fg); font-weight:500 }
  .info p { margin:0 0 6px }
</style>
</head>
<body>
<div class="vwrap" id="vwrap"><video id="v" muted playsinline preload="auto"></video><div id="fx"></div></div>

<div class="bar">
  <div class="cap">
    <span class="t mono" id="ct"></span>
    <span class="n mono" id="cn"></span>
    <span class="l" id="cl"></span>
    <span class="d mono" id="cd"></span>
    <span class="ph" id="cp"></span>
    <span class="right">
      <span id="metrics" style="display:flex;gap:14px"></span>
      <span class="k" id="kfx" title="Flash changes (d)"><span class="sw" style="background:#ff2d75"></span>painted<span class="sw" style="background:#38bdf8"></span>moved</span>
      <span class="k" id="klist" title="Paint list and notes (l)">list</span>
    </span>
  </div>
  <div class="track" id="track">
    <div class="phases" id="phases"></div>
    <div id="ticks"></div>
    <div class="hoverline" id="hoverline"></div>
    <div class="playhead" id="playhead"></div>
    <div class="peek" id="peek"><img id="peekimg" alt=""><div id="peektxt"></div></div>
  </div>
</div>

<aside class="drawer" id="drawer">
  <div class="info" id="info"></div>
  <div id="rows"></div>
</aside>

<script>
// Injected by timeline.py build:
//   paints[i] = { f: frame index, t: seconds, l: label, minor }
//   regions[f] = { paint: [[x,y,w,h]...], move: [[x,y,w,h,dx,dy]...] } normalized; move box = new position
const D = __DATA__;
const PALETTE = ["#3b82f6", "#f59e0b", "#8b5cf6", "#ef4444", "#10b981", "#ec4899", "#14b8a6", "#eab308", "#6366f1", "#525252"];
const END = D.end, VW = D.vw, VH = D.vh, R = D.regions;
let ci = 0;  // palette index skips idle phases
const PH = D.phases.map(p => ({ s: p.start, e: p.end, name: p.name, idle: !!p.idle,
  c: p.idle ? "#6b6b6b" : (p.color || PALETTE[ci++ % PALETTE.length]) }));
const dot = p => `<span class="dot${p.idle ? " idle" : ""}" style="--c:${p.c}"></span>`;
const P = D.paints.map((p, i, a) => ({ ...p, d: (a[i + 1] ? a[i + 1].t : END) - p.t }));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const phaseOf = t => PH.find(p => t >= p.s && t < p.e) || PH[PH.length - 1];
const pct = t => (t / END * 100) + "%";
const fmt = t => t.toFixed(3);
const ms = d => d >= 1 ? d.toFixed(2) + " s" : Math.round(d * 1000) + " ms";
const img = f => `paints/p${String(f).padStart(5, "0")}.jpg`;
const v = $("v"); v.src = D.video;
const seek = t => { v.pause(); v.currentTime = Math.min(END, Math.max(0, t)) + 0.001; };

document.title = "Paint timeline: " + D.title;
$("metrics").innerHTML = D.metrics.slice(0, 2).map(m => `<span><b class="mono">${esc(m.value)}</b> ${esc(m.label)}</span>`).join("");
$("info").innerHTML = `<p><b>${esc(D.title)}</b></p>
  <p><span class="mono">${esc(D.source)}</span> · ${END.toFixed(3)} s · ${P.length} paints</p>
  ${D.metrics.length ? `<p>${D.metrics.map(m => `<b class="mono">${esc(m.value)}</b> ${esc(m.label)}`).join(" · ")}</p>` : ""}
  ${PH.length > 1 ? `<p>${PH.map(p => `${dot(p)}${esc(p.name)} <span class="mono">${ms(p.e - p.s)}</span>`).join("<br>")}</p>` : ""}
  ${D.notes ? `<p>${esc(D.notes)}</p>` : ""}
  <p>Times from recording start (±1 frame). Pink = painted, blue = moved. "Shown" = time until the next paint.</p>
  <p><span class="mono">← →</span> step · <span class="mono">space</span> play · <span class="mono">d</span> changes · <span class="mono">l</span> list · <span class="mono">f</span> fullscreen</p>`;

$("phases").innerHTML = PH.map(p => `<div class="phase${p.idle ? " idle" : ""}" title="${esc(p.name)}" style="left:${pct(p.s)};width:${pct(p.e - p.s)};background:${p.c}"></div>`).join("");
$("ticks").innerHTML = P.map(p => `<div class="tick ${p.minor ? "minor" : ""}" style="left:${pct(p.t)}"></div>`).join("");
$("rows").innerHTML = P.map((p, i) => `<div class="row ${p.minor ? "minor" : ""}" style="--c:${phaseOf(p.t).c}" data-i="${i}">
  <div class="mono">${fmt(p.t)}</div><div class="mono d">${ms(p.d)}</div><div class="lbl">${esc(p.l)}</div></div>`).join("");
P.forEach(p => new Image().src = img(p.f));
document.addEventListener("click", e => { const el = e.target.closest("[data-i]"); if (el) seek(P[+el.dataset.i].t); });

// timeline: scrub, hover preview of the nearest paint
const track = $("track");
const tAt = e => { const r = track.getBoundingClientRect(); return Math.min(END, Math.max(0, (e.clientX - r.left) / r.width * END)); };
const idxAt = t => { let c = 0; P.forEach((p, i) => { if (t + 0.002 >= p.t) c = i; }); return c; };
let drag = false;
track.addEventListener("pointerdown", e => { drag = true; track.setPointerCapture(e.pointerId); seek(tAt(e)); });
track.addEventListener("pointermove", e => {
  const r = track.getBoundingClientRect(), x = e.clientX - r.left, p = P[idxAt(tAt(e))];
  $("hoverline").style.display = "block"; $("hoverline").style.left = x + "px";
  const pk = $("peek"); pk.style.display = "block";
  pk.style.left = Math.min(r.width - 122, Math.max(122, x)) + "px";
  $("peekimg").src = img(p.f);
  $("peektxt").innerHTML = `<span class="mono">${fmt(p.t)} s</span> · ${esc(p.l)}`;
  if (drag) seek(tAt(e));
});
track.addEventListener("pointerup", () => drag = false);
track.addEventListener("pointerleave", () => { $("hoverline").style.display = "none"; $("peek").style.display = "none"; });

// change overlay, aligned to the letterboxed video
let fxOn = true;
function layoutFx() {
  const b = $("vwrap"), s = Math.min(b.clientWidth / VW, b.clientHeight / VH);
  const w = VW * s, h = VH * s;
  Object.assign($("fx").style, { width: w + "px", height: h + "px", left: (b.clientWidth - w) / 2 + "px", top: (b.clientHeight - h) / 2 + "px" });
}
const box = (el, x, y, w, h) => Object.assign(el.style, { left: x * 100 + "%", top: y * 100 + "%", width: w * 100 + "%", height: h * 100 + "%" });
function flash(c) {
  const fx = $("fx"); fx.innerHTML = "";
  if (!fxOn) return;
  const r = R[P[c].f] || { paint: [], move: [] };
  r.move.forEach(([x, y, w, h, dx, dy]) => {
    const d = document.createElement("div"); d.className = "move"; box(d, x, y, w, h);
    d.style.setProperty("--dx", `${-dx / w * 100}%`); d.style.setProperty("--dy", `${-dy / h * 100}%`);
    fx.appendChild(d);
  });
  r.paint.forEach(([x, y, w, h]) => {
    const d = document.createElement("div"); d.className = "flash" + (w * h > 0.5 ? " full" : ""); box(d, x, y, w, h);
    fx.appendChild(d);
  });
}
const toggleFx = () => { fxOn = !fxOn; $("kfx").classList.toggle("off", !fxOn); flash(idxAt(v.currentTime)); };
const toggleList = () => $("drawer").classList.toggle("open");
$("kfx").onclick = toggleFx; $("klist").onclick = toggleList;

const step = dir => {
  const c = idxAt(v.currentTime);
  if (dir < 0) seek(P[Math.max(0, v.currentTime - P[c].t > 0.05 ? c : c - 1)].t);
  else seek(P[Math.min(P.length - 1, c + 1)].t);
};
v.addEventListener("click", () => v.paused ? v.play() : v.pause());
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === "d") toggleFx();
  else if (e.key === "l") toggleList();
  else if (e.key === "Escape") $("drawer").classList.remove("open");
  else if (e.key === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});

let last = -1;
function render() {
  $("playhead").style.left = `calc(${pct(v.currentTime)} - 1px)`;
  const c = idxAt(v.currentTime), p = P[c], ph = phaseOf(v.currentTime);
  $("ct").textContent = v.currentTime.toFixed(3) + " s";
  $("cn").textContent = `${c + 1}/${P.length}`;
  $("cl").textContent = p.l; $("cl").title = p.l;
  $("cd").textContent = "shown " + ms(p.d);
  $("cp").innerHTML = PH.length > 1 ? `${dot(ph)}${esc(ph.name)}` : "";
  if (c !== last) {
    last = c; flash(c);
    document.querySelectorAll(".tick").forEach((t, i) => t.classList.toggle("on", i === c));
    document.querySelectorAll(".row").forEach(r => r.classList.toggle("active", +r.dataset.i === c));
    if ($("drawer").classList.contains("open")) document.querySelector(`.row[data-i="${c}"]`).scrollIntoView({ block: "nearest" });
  }
}
const loop = () => { render(); if (!v.paused) requestAnimationFrame(loop); };
v.addEventListener("play", loop); v.addEventListener("seeked", render); v.addEventListener("timeupdate", render);
window.addEventListener("resize", () => { layoutFx(); render(); });
new ResizeObserver(layoutFx).observe($("vwrap"));
layoutFx();

// ?hold freezes the boxes (for screenshots); #t=6.502 deep-links to a time
if (new URLSearchParams(location.search).has("hold")) document.head.insertAdjacentHTML("beforeend", "<style>.flash,.move{animation:none}</style>");
const h = location.hash.match(/t=([\d.]+)/);
if (h) seek(+h[1]);
v.addEventListener("seeked", () => history.replaceState(null, "", "#t=" + v.currentTime.toFixed(3)));
render();
</script>
</body>
</html>
