packages:
  - "packages/*"
  - "apps/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # @vvedantb/redline 0.1.1 published 2026-10-05; 7-day soak would block this PR.
  - "@vvedantb/redline"
  # @vvedantb/ui 0.12.0 (owner's package) published 2026-10-20 with the shared nav icons.
  - "@vvedantb/ui"
  # Owner's React Native kit for apps/mobile (same as vmem).
  - "@vvedantb/native-ui"
  - "@vvedantb/config"
  # @vvedantb/ui 0.17 imports @vvedantb/server (0.7.1, 2026-10-23) from its root.
  # Backend code mode also runs scripts in the shared sandbox from it.
  - "@vvedantb/server"
  # @vvedantb/ui 0.34.0 depends on @web-kits/motion-blur 0.1.0 (2026-11-02).
  # Pinned to this version only so later releases still soak. Drop after 2026-11-09.
  - "@web-kits/motion-blur@0.1.0"
  # Native (Rust) React Compiler landed 2026-08-18 and is what the web build
  # runs; the 7-day soak would block installs until it ages in.
  - "@vitejs/plugin-react"
  - oxc-transform-react
  - "@oxc-transform-react/*"
  # Same release: oxlint 1.79 is the first with the React Compiler lint rules.
  - oxlint
  - "@oxlint/*"
  # The Agent SDK ships the Claude Code CLI it spawns, and new models are gated
  # on that CLI's version, so a model launch is unusable until we pin the fresh
  # release. A 7-day soak would leave every sandbox failing those turns.
  - "@anthropic-ai/claude-agent-sdk"
  - "@anthropic-ai/claude-agent-sdk-*"
  # json-render 0.21.0 (2026-09-18) is the first release to export
  # experimental_composeSpec / experimental_createEvaluator, which is what the
  # chat's generative UI panels are built on. Drop once it is past the soak.
  - "@json-render/core"
  - "@json-render/react"
  # Drives (persistent storage mounted into a sandbox) went public beta on
  # 2026-09-23 and the SDK tracks the sandbox API closely, so the 7-day soak
  # would keep eva a week behind every provider-side change we depend on.
  - "@vercel/sandbox"
  # tsrs 7.1.0-beta.tsrs2 (oxc's Rust port of TypeScript 7) published 2026-11-16;
  # it runs every typecheck script, 2.4-3.5x faster than tsc-rs here. Drop after 2026-11-23.
  - tsrs
  - "@tsrs/*"
  # @clerk/expo 4.17.2 replaces the deprecated @clerk/clerk-expo (Core 3); native-ui
  # 0.32.0 needs peer @clerk/expo >=4.0.0. Clerk ships the whole family several times
  # a day, so the 7-day soak would block the swap. These are @clerk/expo@4.17.2 and
  # its clerk sub-deps, pinned to these versions only so later releases still soak.
  - "@clerk/expo@4.17.2"
  - "@clerk/react@6.19.2"
  - "@clerk/clerk-js@6.46.1"
  - "@clerk/shared@4.48.1"
