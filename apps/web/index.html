<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Light-theme --app-shell; the script below and FaviconController
         retarget this to the active theme. -->
    <meta name="theme-color" content="#F4F5F6" />
    <meta
      name="description"
      content="Meet Eva, your new AI coworker. Manage tasks, ship code, and track progress in real-time."
    />
    <meta
      name="keywords"
      content="ai coworker, coding assistant, task management, developer tools, code automation"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eva" />
    <meta property="og:title" content="Eva" />
    <meta
      property="og:description"
      content="Meet Eva, your new AI coworker. Manage tasks, ship code, and track progress in real-time."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eva" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Convex + Clerk hints, generated per deployment by vite/originHints.ts -->
    <!-- origin-hints -->
    <!-- Active Google Font is injected by the FOUC script (default Inter).
         Keep fontHrefs in sync with src/lib/contexts/googleFonts.ts. -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Eva - Your New Coworker</title>
    <script>
      (function () {
        // Appearance: prefer FOUC hint (Convex-synced), then legacy "theme" key.
        // Neutral is dark-family: class="dark neutral".
        // The hint carries the preference in `mode`; "system" means follow the
        // OS now, so the stored appearance is ignored (it may be a stale
        // resolution from the last time this device booted).
        var appearance = null;
        try {
          var hintRaw = localStorage.getItem("eva-custom-theme-hint");
          if (hintRaw) {
            var earlyHint = JSON.parse(hintRaw);
            if (earlyHint.mode === "system") {
              appearance = window.matchMedia("(prefers-color-scheme: dark)")
                .matches
                ? "dark"
                : "light";
            } else if (
              earlyHint.appearance === "dark" ||
              earlyHint.appearance === "light" ||
              earlyHint.appearance === "neutral"
            ) {
              appearance = earlyHint.appearance;
            }
          }
        } catch (e) {}
        if (!appearance) {
          var legacy = localStorage.getItem("theme");
          if (
            legacy === "dark" ||
            legacy === "light" ||
            legacy === "neutral"
          ) {
            appearance = legacy;
          }
        }
        if (
          !appearance &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          appearance = "dark";
        }
        if (appearance === "dark" || appearance === "neutral") {
          document.documentElement.classList.add("dark");
        }
        if (appearance === "neutral") {
          document.documentElement.classList.add("neutral");
        }
        // Match browser chrome to --app-shell before paint (see SHELL_COLOR
        // in src/lib/utils/evaMark.ts), so mobile does not flash light.
        var shell = { light: "#F4F5F6", dark: "#020202", neutral: "#222325" };
        if (shell[appearance]) {
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.content = shell[appearance];
        }
        // Apply last-known custom theme before React so fonts/radius don't swap (CLS).
        try {
          var raw = localStorage.getItem("eva-custom-theme-hint");
          if (raw) {
            var hint = JSON.parse(raw);
            var fonts = {
              inter: "Inter, ui-sans-serif, system-ui, sans-serif",
              roboto: "Roboto, ui-sans-serif, system-ui, sans-serif",
              poppins: "Poppins, ui-sans-serif, system-ui, sans-serif",
              "dm-sans": "'DM Sans', ui-sans-serif, system-ui, sans-serif",
              "space-grotesk": "'Space Grotesk', ui-sans-serif, system-ui, sans-serif",
              "host-grotesk": "'Host Grotesk', ui-sans-serif, system-ui, sans-serif",
              geist: "'Geist Sans', ui-sans-serif, system-ui, sans-serif",
              "source-serif": "'Source Serif 4', Georgia, 'Times New Roman', serif",
              jakarta: "'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif",
              outfit: "Outfit, ui-sans-serif, system-ui, sans-serif",
              nunito: "Nunito, ui-sans-serif, system-ui, sans-serif",
              "ibm-plex": "'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif",
              figtree: "Figtree, ui-sans-serif, system-ui, sans-serif",
            };
            var radii = {
              none: "0rem",
              sm: "0.25rem",
              md: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            };
            var tracking = {
              tighter: "-0.04em",
              tight: "-0.02em",
              normal: "-0.012em",
              wide: "0.01em",
              wider: "0.03em",
            };
            var root = document.documentElement.style;
            if (hint.fontFamily && fonts[hint.fontFamily]) {
              root.setProperty("--font-sans", fonts[hint.fontFamily]);
            }
            if (hint.radius && radii[hint.radius]) {
              root.setProperty("--radius", radii[hint.radius]);
            }
            if (hint.letterSpacing && tracking[hint.letterSpacing]) {
              root.setProperty("--tracking-normal", tracking[hint.letterSpacing]);
            }
          }
        } catch (e) {}
        // One family on first paint. Geist has no Google file.
        var fontHrefs = {
          inter: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap",
          roboto: "https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap",
          poppins: "https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap",
          "dm-sans": "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap",
          "space-grotesk": "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap",
          "host-grotesk": "https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&display=swap",
          "source-serif": "https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&display=swap",
          jakarta: "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap",
          outfit: "https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap",
          nunito: "https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap",
          "ibm-plex": "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap",
          figtree: "https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap",
        };
        var fontKey = "inter";
        try {
          var fontRaw = localStorage.getItem("eva-custom-theme-hint");
          if (fontRaw) {
            var fontHint = JSON.parse(fontRaw);
            if (fontHint && fontHint.fontFamily === "geist") {
              fontKey = null;
            } else if (fontHint && fontHrefs[fontHint.fontFamily]) {
              fontKey = fontHint.fontFamily;
            }
          }
        } catch (e) {}
        if (fontKey && fontHrefs[fontKey]) {
          var fontLink = document.createElement("link");
          fontLink.rel = "stylesheet";
          fontLink.href = fontHrefs[fontKey];
          fontLink.media = "print";
          fontLink.onload = function () {
            this.media = "all";
          };
          fontLink.setAttribute("data-eva-font-href", fontHrefs[fontKey]);
          document.head.appendChild(fontLink);
        }
      })();
    </script>
    <script>
      (function () {
        // Stale HTML after a deploy requests hashed /assets/* that 404.
        // The entry module never runs, so this listener (not main.tsx) reloads.
        // Key/param must match staleDeployReload.ts.
        var KEY = "deployment-reload-ts";
        var PARAM = "_eva_reload";
        var COOLDOWN_MS = 10000;
        try {
          var boot = new URL(location.href);
          if (boot.searchParams.has(PARAM)) {
            boot.searchParams.delete(PARAM);
            history.replaceState(null, "", boot.pathname + boot.search + boot.hash);
          }
        } catch (e) {}
        window.addEventListener(
          "error",
          function (event) {
            var t = event.target;
            if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
            var url = t.src || t.href || "";
            if (url.indexOf("/assets/") === -1) return;
            if (t.tagName === "SCRIPT" && t.type !== "module") return;
            if (t.tagName === "LINK" && t.rel !== "modulepreload") return;
            try {
              var last = sessionStorage.getItem(KEY);
              if (last && Date.now() - Number(last) < COOLDOWN_MS) return;
              sessionStorage.setItem(KEY, String(Date.now()));
            } catch (e) {}
            var next = new URL(location.href);
            next.searchParams.set(PARAM, String(Date.now()));
            location.replace(next.href);
          },
          true,
        );
      })();
    </script>
  </head>
  <body class="font-sans text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
